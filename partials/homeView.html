<!--
  Home. The hero, then a tile per top-level category from the Four51 category tree, then
  where to get help. Styled by `.hs-home` in css/store.css.
-->
<section class="hs hs-home">

  <div class="hs-hero">
    <div class="hs-hero-text">
      <p class="hs-kicker">Hertz Official Store</p>
      <h1>Hertz uniforms and gear, in one place.</h1>
      <span class="hs-bar" aria-hidden="true"></span>
      <p class="hs-sub">Choose your items and sizes, then check out in a few steps.</p>
      <div class="hs-hero-ctas">
        <a class="hs-btn" href="" ng-click="scrollToShop()">Start shopping</a>
        <a class="hs-btn hs-btn--ghost" href="order">Order history</a>
      </div>
    </div>
    <div class="hs-hero-media">
      <img src="css/img/hero-lifestyle.jpg" alt="Hertz team members in uniform" />
    </div>
  </div>

  <div class="hs-section" id="shop">
    <div class="hs-section-head">
      <h2>Shop by category</h2>
    </div>

    <div class="hs-cats" ng-if="home.loading">
      <div class="hs-cat" ng-repeat="n in [1,2,3,4]">
        <div class="hs-cat-img hs-skel"></div>
        <div class="hs-cat-body"><span class="hs-skel" style="display:block;height:20px;width:60%"></span></div>
      </div>
    </div>

    <div class="hs-cats" ng-if="!home.loading && home.categories.length">
      <a class="hs-cat" ng-repeat="c in home.categories" href="catalog/{{c.id}}">
        <span class="hs-cat-img">
          <img ng-if="c.image" ng-src="{{c.image}}" alt="" />
        </span>
        <span class="hs-cat-body">
          <span class="hs-cat-name">{{c.name}}</span>
          <span class="hs-cat-desc" ng-if="c.description" ng-bind-html="c.description"></span>
        </span>
      </a>
    </div>

    <div class="hs-empty" ng-if="!home.loading && !home.categories.length">
      <p>There is nothing in the store yet.</p>
    </div>
  </div>

  <div class="hs-help">
    <p>Questions about an order, a size or a delivery?</p>
    <a class="hs-btn" href="contactus">Contact us</a>
  </div>
</section>
