<!--
  Contact us: how to reach a person, when, and where Hertz is.

  One channel, email, because it is the one this shop already shows (at checkout). The
  phone number from the original Hertz contact page was taken down there as a client
  decision, so it is not put back here; add it, or a chat widget, if Hertz and Thumbprint
  choose to.

  Built from the shared account-page components in css/custom.css (`hz-pg-*`). No em dashes
  in the copy.
-->
<section class="hz-pg">

  <div class="hz-pg-head">
    <h1 class="hz-pg-title">Contact us</h1>
  </div>
  <p class="hz-pg-sub">
    Questions about an order or a delivery? Email us and include your order number if you
    have one.
  </p>
  <div class="hz-pg-spacer" aria-hidden="true"></div>

  <div class="hz-pg-cards">
    <div class="hz-pg-card hz-pg-opt">
      <div class="hz-pg-card-b">
        <h2 class="hz-pg-opt-h">Email</h2>
        <p><a href="mailto:hertzsupport@thumbprint.com">hertzsupport@thumbprint.com</a></p>
        <p>We reply during support hours.</p>
        <a class="hz-pg-btn" href="mailto:hertzsupport@thumbprint.com?subject=Hertz%20Shop%20question">Email us</a>
      </div>
    </div>
  </div>

  <div class="hz-pg-facts">
    <div class="hz-pg-fact">
      <p class="hz-pg-fact-k">Support hours</p>
      <address>Monday to Friday<br />9:00am to 5:00pm ET</address>
    </div>
    <div class="hz-pg-fact">
      <p class="hz-pg-fact-k">Headquarters</p>
      <address>15255 Endeavor Drive<br />Noblesville, IN 46060</address>
    </div>
  </div>

</section>
